name: "UR5e"
description: "Universal Robots UR5e - 6 DOF collaborative robot"

# Основные параметры
dof: 6
robot_base: "base"
attachment_site: "attachment_site"

# Ограничения суставов (радианы)
joint_limits:
  - [-6.28319, 6.28319]   # Joint 1: ±170°
  - [-6.28319, 6.28319]     # Joint 2: ±120°  
  - [-3.1415, 3.1415]   # Joint 3: ±175°
  - [-6.28319, 6.28319]     # Joint 4: ±120°
  - [-6.28319, 6.28319]   # Joint 5: ±170°
  - [-6.28319, 6.28319]     # Joint 6: ±120°

# Индексы управляемых суставов
joint_indices: [0, 1, 2, 3, 4, 5]

# Параметры для обратной кинематики
ik_params:
  tolerance: 1e-6
  max_steps: 500
  step_size: 0.01
  max_attempts: 100
  

# Параметры планирования 
default_planning:
  algorithm: "rrt_star"
  max_iterations: 20000
  step_size: 0.05
  goal_radius: 0.08
  goal_bias: 0.4
  step_size: 0.05
  sampling_frequency: 4
  rewire_count: 15
  path_smoothing: true

# Информация о модели MuJoCo
mujoco:
  default_scene: "simulator/models/ur5e/scene.xml" 